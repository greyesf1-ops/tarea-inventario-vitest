services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: local_demo
      POSTGRES_DB: inventario
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["inventario_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  inventario_data:
